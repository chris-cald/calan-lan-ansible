---
- name: Validate persistent safe-reader access
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ssh_safe_reader_test_dir: /tmp/ssh-safe-reader-test
    ssh_safe_reader_enabled: true
    ssh_safe_reader_login_user: "{{ lookup('env', 'USER') }}"
    ssh_safe_reader_key_path: "{{ ssh_safe_reader_test_dir }}/id_ed25519_safe_reader"
    ssh_safe_reader_create_key: true
    ssh_safe_reader_key_passphrase: test-passphrase
    ssh_safe_reader_authorized_keys_path: "{{ ssh_safe_reader_test_dir }}/authorized_keys"
  pre_tasks:
    - name: Remove prior test state
      ansible.builtin.file:
        path: "{{ ssh_safe_reader_test_dir }}"
        state: absent

    - name: Create isolated test directory
      ansible.builtin.file:
        path: "{{ ssh_safe_reader_test_dir }}"
        state: directory
        mode: "0700"
  roles:
    - role: ssh_safe_reader
  tasks:
    - name: Read deployed key
      ansible.builtin.slurp:
        src: "{{ ssh_safe_reader_authorized_keys_path }}"
      register: ssh_safe_reader_authorized_keys

    - name: Assert the restricted public key was deployed
      ansible.builtin.assert:
        that:
          - ssh_safe_reader_authorized_keys.content | b64decode is search('no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-user-rc ssh-ed25519 ')

    - name: Remove persistent key access
      ansible.builtin.include_role:
        name: ssh_safe_reader
      vars:
        ssh_safe_reader_state: absent

    - name: Read removed key file
      ansible.builtin.slurp:
        src: "{{ ssh_safe_reader_authorized_keys_path }}"
      register: ssh_safe_reader_removed_keys

    - name: Assert persistent key access was removed
      ansible.builtin.assert:
        that:
          - ssh_safe_reader_removed_keys.content | b64decode | trim == ''
  post_tasks:
    - name: Clean isolated test state
      ansible.builtin.file:
        path: "{{ ssh_safe_reader_test_dir }}"
        state: absent
