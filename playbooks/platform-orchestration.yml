---
- name: Validate platform orchestration inputs
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: platform_orchestration

- name: Discover platform role eligibility
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: platform_orchestration
    - role: platform_discovery

- name: Bootstrap SSH-ready Raspberry Pi Proxmox nodes
  hosts: proxmox_pi
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: platform_orchestration
    - role: proxmox_pi
      proxmox_pi_apply: >-
        {{ platform_orchestration_mode == 'apply' and
           'proxmox_pi' in platform_orchestration_requested_roles }}
      proxmox_pi_confirm: >-
        {{ 'provision-proxmox-pi' if platform_orchestration_confirmation ==
           platform_orchestration_confirmation_value else '' }}

- name: Bootstrap SSH-ready x64 Proxmox nodes
  hosts: proxmox_x64
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: platform_orchestration
    - role: proxmox_x64
      proxmox_x64_apply: >-
        {{ platform_orchestration_mode == 'apply' and
           'proxmox_x64' in platform_orchestration_requested_roles }}
      proxmox_x64_confirm: >-
        {{ 'provision-proxmox-x64' if platform_orchestration_confirmation ==
           platform_orchestration_confirmation_value else '' }}

- name: Bootstrap SSH-ready supported ARM Proxmox nodes
  hosts: proxmox_arm64
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: platform_orchestration
    - role: proxmox_arm64
      proxmox_arm64_apply: >-
        {{ platform_orchestration_mode == 'apply' and
           'proxmox_arm64' in platform_orchestration_requested_roles }}
      proxmox_arm64_confirm: >-
        {{ 'provision-proxmox-arm64' if platform_orchestration_confirmation ==
           platform_orchestration_confirmation_value else '' }}

- name: Validate or configure existing Proxmox nodes
  hosts: proxmox_existing
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: platform_orchestration
    - role: proxmox_existing
      proxmox_existing_apply: >-
        {{ platform_orchestration_mode == 'apply' and
           'proxmox_existing' in platform_orchestration_requested_roles }}
      proxmox_existing_confirmation: >-
        {{ 'configure-existing-proxmox' if platform_orchestration_confirmation ==
           platform_orchestration_confirmation_value else '' }}

- name: Declare future BMC or Pixie provisioning handoff
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: platform_orchestration
    - role: proxmox_bmc_pixie

- name: Configure optional NVIDIA vGPU hosts
  hosts: proxmox_vgpu
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: platform_orchestration
    - role: proxmox_vgpu_host
      proxmox_vgpu_host_apply: >-
        {{ platform_orchestration_mode == 'apply' and
           'proxmox_vgpu_host' in platform_orchestration_requested_roles }}
      proxmox_vgpu_host_reboot: >-
        {{ 'proxmox_vgpu_host' in platform_orchestration_requested_roles }}
      proxmox_vgpu_host_confirmation: >-
        {{ 'apply-proxmox-vgpu-host' if platform_orchestration_confirmation ==
           platform_orchestration_confirmation_value else '' }}
    - role: proxmox_vgpu_unlock
      proxmox_vgpu_unlock_apply: >-
        {{ platform_orchestration_mode == 'apply' and
           'proxmox_vgpu_host' in platform_orchestration_requested_roles }}
      proxmox_vgpu_unlock_reboot: >-
        {{ 'proxmox_vgpu_host' in platform_orchestration_requested_roles }}
      proxmox_vgpu_unlock_confirmation: >-
        {{ 'apply-proxmox-vgpu-unlock' if platform_orchestration_confirmation ==
           platform_orchestration_confirmation_value else '' }}

- name: Configure optional mediated devices after reboot
  hosts: proxmox_vgpu
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: platform_orchestration
    - role: proxmox_vgpu_mdev
      proxmox_vgpu_mdev_apply: >-
        {{ platform_orchestration_mode == 'apply' and
           'proxmox_vgpu_mdev' in platform_orchestration_requested_roles }}
      proxmox_vgpu_mdev_confirmation: >-
        {{ 'apply-proxmox-vgpu-mdev' if platform_orchestration_confirmation ==
           platform_orchestration_confirmation_value else '' }}

- name: Record the handoff to OpenTofu Talos provisioning
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: platform_orchestration
    - role: talos_handoff
      talos_handoff_apply: >-
        {{ platform_orchestration_mode == 'apply' and
           'talos_handoff' in platform_orchestration_requested_roles }}
      talos_handoff_path: "{{ platform_orchestration_talos_handoff_path }}"
    - role: platform_handoff
