---
- name: Configure guarded Proxmox no-subscription and no-nag behavior
  hosts: all
  become: true

  pre_tasks:
    - name: Require one caller-owned protected inventory
      ansible.builtin.assert:
        that:
          - proxmox_no_nag_inventory is defined
          - proxmox_no_nag_inventory | length > 0
          - proxmox_no_nag_inventory is match('^/')
          - ansible_inventory_sources | length == 1
          - ansible_inventory_sources | first == proxmox_no_nag_inventory
          - proxmox_no_nag_inventory is not match('^' ~ playbook_dir ~ '/')
        fail_msg: >-
          Pass one absolute inventory outside this checkout with -i and
          -e proxmox_no_nag_inventory=/absolute/path/to/protected-hosts.ini.

  roles:
    - role: proxmox_no_nag
