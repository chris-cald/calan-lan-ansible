---
# Caller-owned topology; derived from FingerlessGloves' Raspberry Pi guide.
proxmox_pi_apply: false
proxmox_pi_confirm: ""
proxmox_pi_confirmation: provision-proxmox-pi
proxmox_pi_unsupported_hardware_acknowledgement: ""
proxmox_pi_unsupported_hardware_confirmation: accept-unsupported-raspberry-pi-pve

proxmox_pi_manage_network: false
proxmox_pi_interface: eth0
proxmox_pi_node_address: ""
proxmox_pi_node_prefix: 24
proxmox_pi_gateway: ""
proxmox_pi_node_hostname: "{{ inventory_hostname_short }}"
proxmox_pi_cluster_mode: single
proxmox_pi_cluster_name: ""
proxmox_pi_cluster_link0_address: ""
proxmox_pi_cluster_join_address: ""
proxmox_pi_cluster_join_fingerprint: ""
proxmox_pi_cluster_join_password: ""
proxmox_pi_cluster_join_data_loss_acknowledgement: ""
proxmox_pi_cluster_join_data_loss_confirmation: join-will-overwrite-etc-pve
