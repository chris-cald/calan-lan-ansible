---
- name: Stop unless persistent safe-reader access is explicitly enabled
  ansible.builtin.meta: end_role
  when: not ssh_safe_reader_enabled | bool

- name: Validate safe-reader configuration
  ansible.builtin.assert:
    that:
      - ssh_safe_reader_state in ['present', 'absent']
      - ssh_safe_reader_login_user is match('^[A-Za-z0-9._-]+$')
      - ssh_safe_reader_algorithm == 'ed25519'
      - ssh_safe_reader_key_path | length == 0 or ssh_safe_reader_key_path is match('^/')
      - ssh_safe_reader_authorized_keys_path | length == 0 or ssh_safe_reader_authorized_keys_path is match('^/')
      - ssh_safe_reader_key_options == 'no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-user-rc'
    fail_msg: >-
      ssh_safe_reader requires an existing login user, ed25519, absolute optional paths,
      and the fixed SSH key restrictions.

- name: Resolve controller key paths
  ansible.builtin.set_fact:
    ssh_safe_reader_resolved_key_path: >-
      {{ ssh_safe_reader_key_path if ssh_safe_reader_key_path | length > 0
         else lookup('env', 'HOME') ~ '/.ssh/id_' ~ ssh_safe_reader_algorithm ~ '_safe_reader' }}

- name: Create controller key directory when explicitly generating a key
  ansible.builtin.file:
    path: "{{ ssh_safe_reader_resolved_key_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true
  when: ssh_safe_reader_create_key | bool

- name: Inspect controller key material
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  become: false
  run_once: true
  loop:
    - "{{ ssh_safe_reader_resolved_key_path }}"
    - "{{ ssh_safe_reader_resolved_key_path }}.pub"
  register: ssh_safe_reader_key_stats

- name: Refuse incomplete controller key material
  ansible.builtin.assert:
    that:
      - >-
        ssh_safe_reader_key_stats.results[0].stat.exists or
        not ssh_safe_reader_key_stats.results[1].stat.exists
      - >-
        ssh_safe_reader_key_stats.results[0].stat.exists or ssh_safe_reader_create_key | bool
      - >-
        ssh_safe_reader_key_stats.results[0].stat.exists or
        (ssh_safe_reader_key_passphrase is string and ssh_safe_reader_key_passphrase | length > 0)
    fail_msg: >-
      The safe-reader private key and public key must both exist. Set
      ssh_safe_reader_create_key=true and provide a nonempty user-present passphrase to create them.
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Generate encrypted persistent safe-reader key
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh-keygen
      - -q
      - -t
      - "{{ ssh_safe_reader_algorithm }}"
      - -f
      - "{{ ssh_safe_reader_resolved_key_path }}"
      - -N
      - "{{ ssh_safe_reader_key_passphrase }}"
      - -C
      - ssh-safe-reader
    creates: "{{ ssh_safe_reader_resolved_key_path }}"
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  when: not ssh_safe_reader_key_stats.results[0].stat.exists

- name: Read safe-reader public key
  ansible.builtin.set_fact:
    ssh_safe_reader_public_key: "{{ lookup('ansible.builtin.file', ssh_safe_reader_resolved_key_path ~ '.pub') | trim }}"

- name: Validate safe-reader public key
  ansible.builtin.assert:
    that:
      - ssh_safe_reader_public_key is match('^ssh-ed25519 [A-Za-z0-9+/]+={0,2}( \\S+)?$')
    fail_msg: ssh_safe_reader accepts only an ed25519 public key generated by the configured key path.

- name: Resolve login user details
  ansible.builtin.getent:
    database: passwd
    key: "{{ ssh_safe_reader_login_user }}"
  when: ssh_safe_reader_authorized_keys_path | length == 0

- name: Refuse an unknown safe-reader login user
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd[ssh_safe_reader_login_user] is defined
    fail_msg: "Safe-reader login user does not exist: {{ ssh_safe_reader_login_user }}"
  when: ssh_safe_reader_authorized_keys_path | length == 0

- name: Resolve target authorized_keys path
  ansible.builtin.set_fact:
    ssh_safe_reader_resolved_authorized_keys_path: >-
      {{ ssh_safe_reader_authorized_keys_path if ssh_safe_reader_authorized_keys_path | length > 0
         else ansible_facts.getent_passwd[ssh_safe_reader_login_user][4] ~ '/.ssh/authorized_keys' }}

- name: Ensure target SSH directory exists
  ansible.builtin.file:
    path: "{{ ssh_safe_reader_resolved_authorized_keys_path | dirname }}"
    state: directory
    owner: "{{ ssh_safe_reader_login_user }}"
    group: "{{ ansible_facts.getent_passwd[ssh_safe_reader_login_user][2] }}"
    mode: "0700"
  when:
    - ssh_safe_reader_state == 'present'
    - ssh_safe_reader_authorized_keys_path | length == 0

- name: Install persistent restricted safe-reader key
  ansible.builtin.lineinfile:
    path: "{{ ssh_safe_reader_resolved_authorized_keys_path }}"
    create: true
    owner: "{{ ssh_safe_reader_login_user if ssh_safe_reader_authorized_keys_path | length == 0 else omit }}"
    group: "{{ ansible_facts.getent_passwd[ssh_safe_reader_login_user][2] if ssh_safe_reader_authorized_keys_path | length == 0 else omit }}"
    mode: "0600"
    regexp: '^.* {{ ssh_safe_reader_public_key | regex_escape }}$'
    line: "{{ ssh_safe_reader_key_options }} {{ ssh_safe_reader_public_key }}"
  when: ssh_safe_reader_state == 'present'

- name: Remove persistent safe-reader key
  ansible.builtin.lineinfile:
    path: "{{ ssh_safe_reader_resolved_authorized_keys_path }}"
    state: absent
    regexp: '^.* {{ ssh_safe_reader_public_key | regex_escape }}$'
  when: ssh_safe_reader_state == 'absent'
