---
- name: Inspect loaded NVIDIA kernel modules
  ansible.builtin.command:
    cmd: grep -iE '^nvidia\b' /proc/modules
  register: nvidia_driver_modules
  changed_when: false
  failed_when: nvidia_driver_modules.rc not in [0, 1]
  check_mode: false

- name: Normalize NVIDIA driver loaded fact
  ansible.builtin.set_fact:
    nvidia_driver_loaded: "{{ nvidia_driver_modules.rc == 0 }}"

- name: Read installed NVIDIA driver version
  when: nvidia_driver_loaded
  ansible.builtin.command:
    cmd: modinfo --field version nvidia
  register: nvidia_driver_version
  changed_when: false
  check_mode: false

- name: Normalize NVIDIA driver version fact
  ansible.builtin.set_fact:
    nvidia_driver_version: "{{ nvidia_driver_version.stdout | default('') }}"

- name: List PCI devices
  ansible.builtin.command:
    cmd: lspci -nn
  register: nvidia_pci_devices
  changed_when: false
  check_mode: false

- name: Select NVIDIA VGA devices
  ansible.builtin.set_fact:
    nvidia_gpu_lines: >-
      {{ nvidia_pci_devices.stdout_lines | select('search', 'VGA compatible controller.*NVIDIA') | list }}
    vgpu_fully_supported: false

- name: Determine whether any NVIDIA GPU is Pascal or older
  ansible.builtin.set_fact:
    legacy_gpu: |-
      {{
        item is match(
          (
            "^\d\d:\d\d\.\d VGA compatible controller: NVIDIA Corporation ("
            "NV(0[1-5A]|1[01578AF]|2[058A]|3[014-6]|44A|4[0-4])|"
            "G(7[0-3]|8[046]|9[2468])|MCP(6[178]|7[3789A]|89)|"
            "GF1(0[0468]|1[04679])|C51|GT2(00|1[568])|"
            "GK(10[467]|110B?|208B?|20A|210)|GM(10[78]|20[046B])|"
            "GP10[24678]).*"
          )
        ) | default(false)
      }}
  loop: "{{ nvidia_gpu_lines }}"
  loop_control:
    break_when: legacy_gpu
