---
- name: Install the self-supported vGPU Manager and unlock artifact
  block:
    - name: Create vGPU unlock directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/vgpu-unlock
        - /etc/systemd/system/nvidia-vgpud.service.d
        - /etc/systemd/system/nvidia-vgpu-mgr.service.d

    - name: Install the verified vGPU unlock artifact
      ansible.builtin.copy:
        src: "{{ nvidia_vgpu_unlock_path }}"
        dest: /opt/vgpu-unlock/libvgpu_unlock_rs.so
        mode: "0755"
        checksum: "{{ nvidia_vgpu_unlock_sha256 }}"
      notify: reboot

    - name: Configure vGPU unlock service overrides
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item }}.service.d/vgpu_unlock.conf"
        mode: "0644"
        content: |
          [Service]
          Environment=LD_PRELOAD=/opt/vgpu-unlock/libvgpu_unlock_rs.so
      loop:
        - nvidia-vgpud
        - nvidia-vgpu-mgr
      notify:
        - reload-systemd
        - reboot

    - name: Configure VFIO modules
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: "{{ item }}"
      loop:
        - vfio
        - vfio_iommu_type1
        - vfio_pci
        - vfio_virqfd
      notify:
        - update-initramfs
        - reboot

    - name: Import NVIDIA Manager installation tasks
      ansible.builtin.import_tasks: tasks/nvidia_vgpu_manager.yml

    - name: List mediated-device types
      ansible.builtin.command:
        cmd: mdevctl types
      register: nvidia_vgpu_mdev_types
      changed_when: false
      check_mode: false

    - name: Assert mediated-device types are available
      ansible.builtin.assert:
        that: nvidia_vgpu_mdev_types.stdout | length > 0
        fail_msg: No mediated-device types were exposed by the self-supported vGPU workflow.
