---
- name: Blacklist the nouveau guest driver
  community.general.kernel_blacklist:
    name: nouveau
    state: present
    blacklist_file: /etc/modprobe.d/blacklist-nouveau.conf
  notify:
    - update-initramfs
    - reboot-guest

- name: Install verified NVIDIA guest driver artifact
  ansible.builtin.copy:
    src: "{{ nvidia_guest_driver_path }}"
    dest: /opt/nvidia-guest-driver.run
    mode: "0755"
    checksum: "{{ nvidia_guest_driver_sha256 }}"
  notify: reboot-guest

- name: Run verified NVIDIA guest driver installer
  ansible.builtin.command:
    cmd: /opt/nvidia-guest-driver.run --dkms -m=kernel
  register: nvidia_guest_driver_install
  changed_when: >-
    nvidia_guest_driver_install.stdout is search(
      'Installation of the NVIDIA Accelerated Graphics Driver .* is now complete\\.'
    )
  notify: reboot-guest
