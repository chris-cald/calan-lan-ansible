---
- name: Discover or configure self-supported NVIDIA vGPU hosts
  hosts: device_roles_vgpu
  become: true
  vars:
    nvidia_vgpu_apply: false
    nvidia_vgpu_reboot: false
    nvidia_vgpu_confirmation: ""
    nvidia_vgpu_confirmation_value: apply-self-supported-vgpu
    nvidia_vgpu_driver_path: ""
    nvidia_vgpu_driver_sha256: ""
    nvidia_vgpu_unlock_path: ""
    nvidia_vgpu_unlock_sha256: ""
  pre_tasks:
    - name: Validate self-supported vGPU apply inputs
      ansible.builtin.import_tasks: tasks/nvidia_vgpu_guard.yml

  tasks:
    - name: Gather NVIDIA GPU facts
      ansible.builtin.include_tasks:
        file: tasks/gather_nvidia_facts.yml
        apply:
          tags: [host]

    - name: Gather bootloader facts
      ansible.builtin.include_tasks:
        file: tasks/gather_bootloader_facts.yml
        apply:
          tags: [host]

    - name: Configure approved self-supported vGPU host changes
      when: nvidia_vgpu_apply | bool
      block:
        - name: Enable IOMMU
          ansible.builtin.include_tasks:
            file: tasks/iommu.yml
            apply:
              tags: [host]

        - name: Install NVIDIA Manager and unlock artifact
          ansible.builtin.include_tasks:
            file: tasks/nvidia_enable_vgpu.yml
            apply:
              tags: [host]

  handlers:
    - name: Reload boot settings
      listen: reload-boot-settings
      ansible.builtin.command:
        cmd: '{{ "proxmox-boot-tool refresh" if bootloader == "systemd-boot" else "update-grub" }}'
      changed_when: true

    - name: Import NVIDIA driver handlers
      ansible.builtin.import_tasks: handlers/nvidia_driver_handlers.yml
